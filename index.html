<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biografia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <div class="avatar-wrapper">
        <img id="avatar" src="" alt="Foto de perfil" class="avatar" />
      </div>
      <h1 class="name" id="hero-name"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="hero-meta">
        <span id="meta-location"></span>
        <span id="meta-birthday"></span>
        <span id="meta-sign"></span>
      </div>
    </div>
  </header>

  <nav class="sticky-nav">
    <a href="#sobre">Sobre</a>
    <a href="#amigos">Amigos</a>
    <a href="#livros">Livros</a>
    <a href="#namorado">Namorado</a>
    <a href="#hobbies">Hobbies</a>
  </nav>

  <main>

    <section id="sobre" class="section">
      <div class="section-inner">
        <h2 class="section-title"><span class="icon">👤</span> Sobre</h2>
        <div class="card about-card">
          <p class="bio-text" id="bio-text"></p>
          <div class="stats">
            <div class="stat"><strong id="stat-age"></strong><span>Anos</span></div>
            <div class="stat"><strong id="stat-friends"></strong><span>Amigos</span></div>
            <div class="stat"><strong id="stat-books"></strong><span>Livros lidos</span></div>
            <div class="stat"><strong id="stat-hobbies"></strong><span>Hobbies</span></div>
          </div>
        </div>
      </div>
    </section>

    <section id="amigos" class="section section-alt">
      <div class="section-inner">
        <h2 class="section-title"><span class="icon">👯</span> Amigos</h2>
        <div class="cards-grid" id="friends-grid"></div>
      </div>
    </section>

    <section id="livros" class="section">
      <div class="section-inner">
        <h2 class="section-title"><span class="icon">📚</span> Livros</h2>
        <div class="books-list" id="books-list"></div>
      </div>
    </section>

    <section id="namorado" class="section section-alt">
      <div class="section-inner">
        <h2 class="section-title"><span class="icon">💕</span> Namorado</h2>
        <div class="card couple-card" id="couple-card"></div>
      </div>
    </section>

    <section id="hobbies" class="section">
      <div class="section-inner">
        <h2 class="section-title"><span class="icon">🎨</span> Hobbies</h2>
        <div class="hobbies-grid" id="hobbies-grid"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Feito com 💜 · Biografia criada com carinho</p>
  </footer>

  <script>
  const BOOK_COLORS = [
    'linear-gradient(135deg,#667eea,#764ba2)',
    'linear-gradient(135deg,#f093fb,#f5576c)',
    'linear-gradient(135deg,#4facfe,#00f2fe)',
    'linear-gradient(135deg,#43e97b,#38f9d7)',
    'linear-gradient(135deg,#fa709a,#fee140)',
    'linear-gradient(135deg,#a18cd1,#fbc2eb)',
  ];

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function avatarUrl(seed, photo) {
    return photo || `https://api.dicebear.com/7.x/personas/svg?seed=${encodeURIComponent(seed)}`;
  }

  function render(d) {
    document.title = (d.name || 'Biografia') + ' · Biografia';

    document.getElementById('avatar').src = avatarUrl('profile', d.avatar);
    document.getElementById('hero-name').textContent = d.name || '';
    document.getElementById('hero-tagline').textContent = d.tagline || '';
    document.getElementById('meta-location').textContent = d.location ? '📍 ' + d.location : '';
    document.getElementById('meta-birthday').textContent = d.birthday ? '🎂 ' + d.birthday : '';
    document.getElementById('meta-sign').textContent = d.sign ? '⭐ ' + d.sign : '';

    document.getElementById('bio-text').textContent = d.bio || '';
    document.getElementById('stat-age').textContent = d.stats?.age || '—';
    document.getElementById('stat-friends').textContent = d.stats?.friends || '—';
    document.getElementById('stat-books').textContent = d.stats?.books || '—';
    document.getElementById('stat-hobbies').textContent = d.stats?.hobbies || '—';

    document.getElementById('friends-grid').innerHTML = (d.friends || []).map(f => `
      <div class="friend-card">
        <img src="${esc(avatarUrl(f.name, f.photo))}" alt="${esc(f.name)}" class="friend-avatar" />
        <h3>${esc(f.name)}</h3>
        <p class="friend-since">Amigos desde ${esc(f.since)}</p>
        <p class="friend-desc">${esc(f.desc)}</p>
        ${f.tag ? `<span class="tag">${esc(f.tag)}</span>` : ''}
      </div>
    `).join('');

    document.getElementById('books-list').innerHTML = (d.books || []).map((b, i) => {
      const s = Math.min(5, Math.max(1, parseInt(b.stars) || 5));
      return `
        <div class="book-card">
          <div class="book-cover" style="background:${BOOK_COLORS[i % BOOK_COLORS.length]}">
            <span class="book-initial">${esc((b.title||'?')[0].toUpperCase())}</span>
          </div>
          <div class="book-info">
            <h3>${esc(b.title)}</h3>
            <p class="book-author">${esc(b.author)}</p>
            <div class="stars">${'★'.repeat(s)}${'☆'.repeat(5-s)}</div>
            <p class="book-review">${esc(b.review)}</p>
          </div>
        </div>
      `;
    }).join('');

    const p = d.partner || {};
    document.getElementById('couple-card').innerHTML = `
      <div class="couple-avatars">
        <div class="couple-person">
          <img src="${esc(avatarUrl('me', p.myPhoto))}" alt="${esc(p.myName)}" class="couple-avatar" />
          <span>${esc(p.myName)}</span>
        </div>
        <div class="heart-center">💖</div>
        <div class="couple-person">
          <img src="${esc(avatarUrl('partner', p.partnerPhoto))}" alt="${esc(p.partnerName)}" class="couple-avatar" />
          <span>${esc(p.partnerName)}</span>
        </div>
      </div>
      <div class="couple-info">
        <div class="couple-detail"><strong>📅 Juntos desde:</strong> ${esc(p.since)}</div>
        <div class="couple-detail"><strong>📍 Onde se conheceram:</strong> ${esc(p.where)}</div>
        <div class="couple-detail"><strong>🌟 O que os une:</strong> ${esc(p.common)}</div>
      </div>
      <blockquote class="love-quote">"${esc(p.quote)}"</blockquote>
    `;

    document.getElementById('hobbies-grid').innerHTML = (d.hobbies || []).map(h => `
      <div class="hobby-card">
        <span class="hobby-icon">${esc(h.emoji)}</span>
        <h3>${esc(h.name)}</h3>
        <p>${esc(h.desc)}</p>
      </div>
    `).join('');

    const sections = document.querySelectorAll('section[id]');
    const links = document.querySelectorAll('.sticky-nav a');
    new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          links.forEach(a => { a.style.background=''; a.style.color=''; });
          const a = document.querySelector(`.sticky-nav a[href="#${e.target.id}"]`);
          if (a) { a.style.background='var(--primary)'; a.style.color='#fff'; }
        }
      });
    }, { threshold: 0.4 }).observe && sections.forEach(s =>
      new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            links.forEach(a => { a.style.background=''; a.style.color=''; });
            const a = document.querySelector(`.sticky-nav a[href="#${e.target.id}"]`);
            if (a) { a.style.background='var(--primary)'; a.style.color='#fff'; }
          }
        });
      }, { threshold: 0.4 }).observe(s)
    );
  }

  fetch('data.json?t=' + Date.now())
    .then(r => r.json())
    .then(render)
    .catch(() => {
      document.getElementById('hero-name').textContent = 'Carregando...';
    });
  </script>
</body>
</html>
